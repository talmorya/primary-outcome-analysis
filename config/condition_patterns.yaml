version: "0.1.0"

targets:
  back_pain:
    label: "Back pain"
    patterns:
      - "chronic\\s+.*back"
      - "low\\s+back\\s+pain"
      - "clbp"
      - "lbp"
      - "non[- ]specific\\s+low\\s+back"
      - "chronic\\s+low\\s+back"

  migraine:
    label: "Migraine"
    patterns:
      - "migraine"
      - "chronic\\s+migraine"

  fibromyalgia:
    label: "Fibromyalgia"
    patterns:
      - "fibromyalgia"
      - "\\bfm\\b"
