version: "1.0.0"

# Cohort condition rules (layer 2). API retrieval uses the four condition search terms;
# local matching refines target flags and inclusion.

targets:
  migraine:
    label: "Migraine"
    patterns:
      - "migraine"
      - "chronic\\s+migraine"
      - "vestibular\\s+migraine"

  back_pain:
    label: "Back pain"
    patterns:
      - "chronic\\s+.*back"
      - "low\\s+back\\s+pain"
      - "\\bclbp\\b"
      - "\\blbp\\b"
      - "non[- ]specific\\s+low\\s+back"
      - "chronic\\s+low\\s+back"
      - "back\\s+pain"
      - "pain\\s*,\\s*back"

  fibromyalgia:
    label: "Fibromyalgia"
    patterns:
      - "f[iy]bromyalgi"
      - "\\bfm\\b"

  headache:
    label: "Headache (non-migraine emphasis)"
    patterns:
      - "tension[- ]?type"
      - "tension headache"
      - "\\btth\\b"
      - "cluster headache"
      - "trigeminal autonomic"
      - "hemicrania continua"
      - "paroxysmal hemicrania"
      - "\\bsunct\\b"
      - "\\bsuna\\b"
      - "chronic daily headache"
      - "\\bcdh\\b"
      - "new daily persistent"
      - "\\bndph\\b"
      - "primary headache"
      - "headache disorder"
      - "chronic\\s+headaches?"
      - "chronic headache"
      - "episodic headache"
      - "recurrent headache"
      - "\\bheadaches\\b"
      - "pediatric headache"
      - "headache in children"
      - "headache in adolescent"
      - "^headache$"
      - "^headaches$"
      - "\\bheadache\\b"
      - "pain\\s*,\\s*head\\b"
      - "\\bhead\\s+pain"

# Automatic study-level exclusions (condition stage only).
exclusion_rules:
  cancer_oncology:
    patterns:
      - "(?<!non[- ])(?<!non )cancer"
      - "carcinoma"
      - "oncolog"
      - "neoplasm"
      - "malignan"
      - "head and neck carcinoma"

  pathology_other:
    patterns:
      - "intracranial hypertension"
      - "idiopathic intracranial"
      - "pseudotumor"
      - "meningitis"
      - "multiple sclerosis"
      - "clinically isolated syndrome"

  # Pregnancy / postpartum / menstrual / pelvic girdle pain is a different pain population.
  pregnancy_related:
    patterns:
      - "pregnan"
      - "post\\s*-?\\s*partum"
      - "childbirth"
      - "menstrual"
      - "dysmenorr"
      - "pelvic\\s+girdle"

  # Acute = the word "acute" describing the enrolled population.
  # Duration windows ("pain for less than 3 months", recent surgery/injury) are NOT
  # automatic exclusions: phrasing varies too much. See pain_duration_inclusion.
  # Subacute / peri-operative / post-surgical populations are excluded through the
  # condition_feature_flags (see flag_exclusion below).
  acute_pain:
    patterns:
      - '\bacute\s+(low\s+)?back\s+pain\b'
      - '\bacute\s+back\s+pain\b'
      - '\bpain\s*,\s*acute\b'
      - '\bacute\s+pain\b'
      - '\bacute\s+brain\b'
      - '\bacute\s+injur'
      - '\bacute\s+non[- ]cancer'
      - '\bacute\s+(neck|back|musculoskeletal|headache)'
      - '(?:neck|back|musculoskeletal|headache)(?:\s+pain)?[\s,:(\-]{0,4}\bacute\b'
      - '"acute"'
      - '\bacute\b.{0,80}(?:diagnosis|icd)'
    # Text that denies acute enrolment ("no acute pain", "non-acute", "acute pain excluded"):
    # when it appears in a text, that text is not treated as describing an acute population.
    negation: '\b(not|no|without|non[-\s]|exclude[d]?|excluding)\b[^.;\n]{0,50}\bacute\b|\bacute\b[^.;\n]{0,30}\b(exclud|not eligible|not due)'
    # Uses of "acute" that do not describe the enrolled population (a match is ignored only when
    # its own "acute" sits inside one of these phrases).
    ignore_phrases:
      - '\bacute\s+(?:noxious|physical)\s+stimul|\bresponse\s+to\s+acute\s+noxious'      # lab stimulus
      - '\bacute\s+(?:pain\s+)?(?:relief|medications?|treatments?|therapy|therapies|drugs?|analgesics?|attacks?)\b'  # drug wording
      - '\bacute\s+(?:pain\s+)?(?:episodes?|flares?|flare-ups?|exacerbations?)\s+of\s+(?:\w+\s+){0,2}chronic\b'  # chronic patients with a flare
      - '\bchronic\s+(?:\w+\s+){0,2}(?:versus|vs\.?|rather\s+than|compared\s+(?:to|with))\s+(?:\w+\s+)?acute\b|\bacute\s+(?:\w+\s+){0,2}(?:versus|vs\.?)\s+chronic\b'  # background contrast

# Tags recorded in condition_feature_flags. Only the flags listed under flag_exclusion
# exclude a trial; the others are descriptive.
condition_features:
  post_traumatic:
    patterns:
      - "post[- ]?traumatic headache"
      - "posttraumatic headache"
      - "post[- ]?traumatic pain"
      - "post[- ]?concuss"
      - "post concussion syndrome"
      - "persistent post.?traumatic"
      - "post concussive headache"

  tbi_concussion:
    patterns:
      - "traumatic brain injury"
      - "\\btbi\\b"
      - "brain injur"
      - "concussion, brain"
      - "mild traumatic brain"
      - "post[- ]?concussion syndrome"

  subacute:
    patterns:
      - "\\bsub[- ]?acute\\b"
      - "subacute pain"
      - "sub[- ]acute low back"
      - "subacute (?:low )?back"

  perioperative:
    patterns:
      - "peri[- ]?operative(?!ly)"
      - "\\bpre[- ]?operative(?!ly)\\b"
      - "before (?:spine |spinal |lumbar )?surgery"
      - "undergoing (?:spine |spinal |lumbar )?surgery"
      - "scheduled (?:for|to undergo) .{0,40}surgery"

  surgical_postoperative:
    patterns:
      - "disc prosthesis"
      - "total disc replacement"
      - "lumbar disc prosthesis"
      - "spinal fusion"
      - "post[- ]?operative(?!ly)"
      - "postsurgical"
      - "after lumbar spine surgery"
      - "failed back surgery"
      - "post[- ]?dural"
      - "postdural"
      - "pdph\\b"

  secondary_pain:
    patterns:
      - "secondary headache"
      - "secondary pain"
      - "cervicogenic"
      - "pain due to malignancy"

  visual_snow:
    patterns:
      - "visual snow"

  vestibular_schwannoma:
    patterns:
      - "vestibular schwannoma"
      - "acoustic neuroma"

  medication_overuse_headache:
    patterns:
      - "medication[- ]?overuse"
      - "medication overuse"
      - "\\bmoh\\b"
      - "rebound headache"
      - "analgesic overuse"

# Trials carrying any of these condition_feature_flags are excluded (rule key below).
# Rationale: subacute-only and peri/pre/post-operative populations are transitional /
# chronification-prevention settings; preventing development of chronic pain is
# conceptually distinct from registered primary outcomes in established chronic pain.
flag_exclusion:
  rule: subacute_perioperative
  flags:
    - subacute
    - perioperative
    - surgical_postoperative
  # A trial whose only excluding flag is `surgical_postoperative` is KEPT when its
  # INCLUSION criteria show established chronic pain: the word "chronic", or a duration
  # of "<>= / > / more than / at least> <3 or 6 months, 1 year, 12 weeks>" (other words
  # may sit in between, e.g. "at least 3 consecutive months", "more than 12 weeks"; a
  # trailing "or more" is irrelevant; "3+ months" counts as "at least 3 months").
  # Duration phrases must be in a sentence that also mentions pain/symptoms.
  # `subacute` / `perioperative` flags are never overridden.
  keep_when_chronic_in_inclusion:
    flags:
      - surgical_postoperative
    word_patterns:
      - "\\bchronic\\b"
    # Hard exclusion: even with a chronic cue, a trial whose INCLUSION criteria say the
    # population is acute or subacute is excluded.
    unless_inclusion_mentions:
      - "\\bsub-?acute\\b"
      - "\\bacute\\b"
    duration_patterns:
      - "\\b(?:3|6|12)\\s*\\+\\s*(?:months?|mos?|weeks?|wks?)\\b"
      - "(?:>=|≥|>|more\\s+than|at\\s+least)\\s*(?:[a-z-]+\\s+){0,3}(?:(?:3|three|6|six|12|twelve)[\\s-]*(?:[a-z-]+\\s+){0,2}(?:months?|mos?)\\b|(?:1|one)[\\s-]*(?:[a-z-]+\\s+){0,2}(?:years?|yrs?)\\b|(?:12|twelve)[\\s-]*(?:[a-z-]+\\s+){0,2}(?:weeks?|wks?)\\b)"

# Explicit short pain window: an INCLUSION sentence mentioning pain/symptoms with a number of
# weeks <= max_weeks (11 = under 12 weeks; ranges use every bound, so "6 to 12 weeks" counts)
# marks an acute/subacute population. Guards: sentences about medication stability, surgery,
# injections etc. are skipped; pain-rating look-backs ("score >= 4 over the past 2 weeks")
# are skipped. The exclusion is HARD: a chronic cue in the inclusion criteria or the title
# does not rescue the trial. Only exception: EVERY registered condition contains "chronic"
# (e.g. only "Chronic Low-back Pain"), the same exception the acute-population screen uses.
short_pain_window:
  rule: short_pain_window
  max_weeks: 11
  pain_pattern: '\b(?:pain|symptoms?)\b'
  skip_patterns:
    - 'medications?|\bdoses?\b|stable|regimen|\bdrugs?\b|analgesic|injection|surg|physio|physical therapy'
    - '\bno\b|\bnot\b|without|planned|\bfree of\b'
  rating_pattern: 'intensity|rating|\bscores?\b|\bscale\b|\bVAS\b|\bNRS\b|\bPCSS\b|\bLikert\b'
  lookback_before: '(?:past|last|previous|preceding)\s*$'
  lookback_after: '\s*(?:preceding|before (?:the )?(?:clinical trial|screening|baseline))'

# Not about pain at all: no pain word in titles + inclusion criteria + primary outcomes.
# Such trials (concussion, tinnitus, healthy adults ...) have outcomes unrelated to pain recovery
# or interference, so they would pollute the outcomes this study focuses on.
not_about_pain:
  rule: not_about_pain
  pain_wording_patterns:
    - 'pain|\bache\b|\baches\b|headache|migraine|fibromyalg|\blbp\b|\bclbp\b|sciatic|analges|discomfort|\bfms?\b'

# Descriptive review flags (never exclude). Matched against brief + official title.
review_flags:
  provider_or_system_level:
    patterns:
      - "clinician"
      - "physician"
      - "provider"
      - "decision support"
      - "clinical decision"
      - "nudge"
      - "guideline"
      - "implementation"
      - "champion"
      - "care model"
      - "health system"
      - "quality improvement"
      - "referral"
      - "clinical practice"
      - "knowledge translation"
      - "general practitioner"
