version: "1.0.0"

# Cohort condition rules (layer 2). API retrieval uses the four condition search terms;
# local matching refines target flags and inclusion.

targets:
  migraine:
    label: "Migraine"
    patterns:
      - "migraine"
      - "chronic\\s+migraine"
      - "vestibular\\s+migraine"

  chronic_back_pain:
    label: "Chronic back pain"
    patterns:
      - "chronic\\s+.*back"
      - "low\\s+back\\s+pain"
      - "\\bclbp\\b"
      - "\\blbp\\b"
      - "non[- ]specific\\s+low\\s+back"
      - "chronic\\s+low\\s+back"
      - "back\\s+pain"

  fibromyalgia:
    label: "Fibromyalgia"
    patterns:
      - "fibromyalgia"
      - "\\bfm\\b"

  headache:
    label: "Headache (non-migraine emphasis)"
    patterns:
      - "tension[- ]?type"
      - "tension headache"
      - "\\btth\\b"
      - "cluster headache"
      - "trigeminal autonomic"
      - "hemicrania continua"
      - "paroxysmal hemicrania"
      - "\\bsunct\\b"
      - "\\bsuna\\b"
      - "chronic daily headache"
      - "\\bcdh\\b"
      - "new daily persistent"
      - "\\bndph\\b"
      - "primary headache"
      - "headache disorder"
      - "chronic\\s+headaches?"
      - "chronic headache"
      - "episodic headache"
      - "recurrent headache"
      - "\\bheadaches\\b"
      - "pediatric headache"
      - "headache in children"
      - "headache in adolescent"
      - "^headache$"
      - "^headaches$"
      - "\\bheadache\\b"

# Automatic study-level exclusions (condition stage only).
exclusion_rules:
  cancer_oncology:
    patterns:
      - "(?<!non[- ])(?<!non )cancer"
      - "carcinoma"
      - "oncolog"
      - "neoplasm"
      - "malignan"
      - "head and neck carcinoma"

  pathology_other:
    patterns:
      - "intracranial hypertension"
      - "idiopathic intracranial"
      - "pseudotumor"
      - "meningitis"
      - "multiple sclerosis"
      - "clinically isolated syndrome"

  acute_pain:
    patterns:
      - "\\bacute\\s+(low\\s+)?back\\s+pain\\b"
      - "\\bacute\\s+back\\s+pain\\b"
      - "\\bpain\\s*,\\s*acute\\b"
      - "\\bacute\\s+pain\\b"
      - "\\bacute\\s+brain\\b"
      - "\\bacute\\s+injur"
      - "\\bacute\\s+non[- ]cancer"
      - "\\bacute\\s+(neck|back|musculoskeletal|headache)"
      - "(?:neck|back|musculoskeletal|headache)(?:\\s+pain)?[\\s,:(\\-]{0,4}\\bacute\\b"
      - '"acute"'
      - "\\bacute\\b.{0,80}(?:diagnosis|icd)"
      - "pain\\s+onset\\s+(within|less than|<)\\s*(3\\s*months|12\\s*weeks|ninety\\s*days)"
      - "onset\\s+(within|less than|<)\\s*(3\\s*months|12\\s*weeks)\\s+.*pain"
      - "pain\\s+for\\s+less\\s+than\\s+(3\\s*months|12\\s*weeks)"
      - "duration\\s+of\\s+pain\\s+.*(less than|<)\\s*(3\\s*months|12\\s*weeks)"
      - "within\\s+(the\\s+)?(past|previous|last)\\s+3\\s+months.*pain"
      - "within\\s+(the\\s+)?(past|previous|last)\\s+12\\s+weeks.*pain"

# Descriptive flags only — do not exclude on match alone.
condition_features:
  post_traumatic:
    patterns:
      - "post[- ]?traumatic headache"
      - "posttraumatic headache"
      - "post[- ]?traumatic pain"
      - "post[- ]?concuss"
      - "post concussion syndrome"
      - "persistent post.?traumatic"
      - "post concussive headache"

  tbi_concussion:
    patterns:
      - "traumatic brain injury"
      - "\\btbi\\b"
      - "brain injur"
      - "concussion, brain"
      - "mild traumatic brain"
      - "post[- ]?concussion syndrome"

  surgical_postoperative:
    patterns:
      - "disc prosthesis"
      - "total disc replacement"
      - "lumbar disc prosthesis"
      - "spinal fusion"
      - "postoperative"
      - "post[- ]?operative"
      - "postsurgical"
      - "after lumbar spine surgery"
      - "failed back surgery"
      - "post[- ]?dural"
      - "postdural"
      - "pdph\\b"

  secondary_pain:
    patterns:
      - "secondary headache"
      - "secondary pain"
      - "cervicogenic"
      - "pain due to malignancy"

  visual_snow:
    patterns:
      - "visual snow"

  vestibular_schwannoma:
    patterns:
      - "vestibular schwannoma"
      - "acoustic neuroma"

  medication_overuse_headache:
    patterns:
      - "medication[- ]?overuse"
      - "medication overuse"
      - "\\bmoh\\b"
      - "rebound headache"
      - "analgesic overuse"

population_mismatch:
  min_non_target_conditions: 3
