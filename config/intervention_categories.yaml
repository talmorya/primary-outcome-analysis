version: "2.2.1"

# Treatment-oriented intervention categories (active arms only; comparators excluded).
# Comparator arms: matched against intervention arm NAME only (not description).
# Pure control labels must not contribute categories (including other_behavioral_treatment).

control_arm:
  # Match pure comparator labels in the arm NAME only. Prefer anchored / trailing
  # "control" forms so active names like "Museum therapy ... control condition ..." stay active.
  patterns:
    - "placebo"
    - "\\bsham\\b"
    - "wait[- ]?list"
    - "waiting list"
    - "usual care"
    - "standard care"
    - "standard of care"
    - "standard medical"
    - "typical care"
    - "business as usual"
    - "minimally enhanced usual care"
    - "treatment as usual"
    - "(?<![A-Za-z])TAU(?![A-Za-z])"
    - "no intervention"
    - "no additional intervention"
    - "screening and outcome evaluation only"
    - "attention control"
    - "^controls?$"
    - "^control\\s*:"
    - "^control\\s+group$"
    - "^control\\s+arm$"
    - "^control\\s+condition$"
    - "^control\\s+intervention$"
    - "^(?:passive|active)\\s+control(?:\\s+intervention)?$"
    - "control\\s+group$"
    - "control\\s+arm$"
    - "control\\s+condition$"
    - "control\\s+intervention$"
    - "(?:education|website|activity)\\s+control(?:\\s+intervention)?$"
    - "[-\\s]control$"
  # Keep active therapies whose names happen to contain control/TAU vocabulary.
  exclude_patterns:
    - "motor\\s+control"
    - "stimulus\\s+control"
    - "movement\\s+control"
    - "postural\\s+control"
    - "pain\\s+control"
    - "self[- ]?control"
    - "impulse\\s+control"
    - "bladder\\s+control"
    - "birth\\s+control"
    - "quality\\s+control"
    - "breath(?:ing)?\\s+control"
    - "additional to"
    - "\\+"
    - "improved treatment as usual"

mechanism_arm:
  patterns:
    - "psychophysical"
    - "experimental\\s+heat\\s+pain"
    - "cover\\s+story"
    - "nocebo"
    - "PASAT"
    - "quantitative\\s+sensory"
    - "\\bqst\\b"
    - "resting\\s+state\\s+eeg"
    - "picture\\s+viewing\\s+eeg"
    - "cognitive\\s+assessment\\s+mapping"
    - "affective\\s+touch"
    - "walk\\s+test"
    - "thermal\\s+stimuli"
    - "pressure\\s+pain\\s+threshold"
    - "pain\\s+threshold\\s+test"
    - "functional\\s+magnetic\\s+resonance"
    - "\\bfmri\\b"
    - "neuroimaging\\s+paradigm"
    - "experimental\\s+pain"
    - "pain\\s+modulation\\s+efficiency"
    - "conditioned\\s+pain\\s+modulation"
  exclude:
    - "emotional\\s+regulation"
    - "emotional\\s+(positive|negative)"
    - "\\bpbre\\b"
    - "consecutive\\s+days"
    - "administered\\s+for\\s+one\\s+hour"

categories:
  psychological_cognitive:
    label: "Psychological & cognitive therapy"
    description: >
      Changing thoughts, cognitive distortions, and behavioral coping (not brain-retraining
      or exposure-based unlearning of pain loops). Behavioral activation stays here;
      graded activity/exposure belong under neuroplastic_recovery_therapy.
    patterns:
      - "cognitive\\s+behav"
      - "cognitive-behavioral"
      - "\\bcbt\\b"
      - "\\bcbgt\\b"
      - "acceptance\\s+and\\s+commitment"
      - "\\bact\\b"
      - "psychotherapy"
      - "psychodynamic"
      - "interpersonal\\s+therapy"
      - "behavioral\\s+therapy"
      - "behavioural\\s+therapy"
      - "emdr"
      - "eye[- ]movement[- ]desensitization"
      - "eye\\s+movement\\s+desensitization"
      - "dialectical\\s+behavior"
      - "\\bdbt\\b"
      - "motivational\\s+interview"
      - "operant\\s+behavioral"
      - "emotional\\s+regulation"
      - "\\bpbre\\b"
      - "cognitive\\s+functional"
      - "\\bcft\\b"
      - "problem[- ]solving\\s+therapy"
      - "problem\\s+solving\\s+therapy"
      - "\\bpst\\b"
      - "behavioral\\s+activation"
      - "behavioural\\s+activation"

  neuroplastic_recovery_therapy:
    label: "Neuroplastic recovery therapy"
    description: >
      Brain-retraining approaches aimed at unlearning maladaptive neural pain loops
      (PRT, EAET, graded exposure/activity, amygdala retraining, sensory discrimination),
      distinct from general cognitive coping.
    patterns:
      - "pain\\s+reprocess"
      - "pain\\s+re-processing"
      - "\\bprt\\b"
      - "emotional\\s+awareness\\s+and\\s+expression"
      - "\\beaet\\b"
      - "exposure\\s+therapy"
      - "graded\\s+exposure"
      - "graded\\s+activity"
      - "amygdala\\s+retrain"
      - "amygdala\\s+and\\s+insula\\s+retrain"
      - "\\barp\\b"
      - "two[- ]point\\s+discrimination"
      - "sensory\\s+discrimination"
      - "tactile\\s+discrimination"

  mind_body_integrative:
    label: "Mind-body & integrative practice"
    description: >
      Movement, touch, or body-based practice integrated with mental focus to calm
      the nervous system (includes former mind-body and complementary categories).
    patterns:
      - "mindful"
      - "\\bmbsr\\b"
      - "\\bmbct\\b"
      - "mindfulness"
      - "meditation"
      - "hypnosis"
      - "hypnotherapy"
      - "relaxation"
      - "progressive\\s+muscle"
      - "yoga"
      - "tai\\s+chi"
      - "pilates"
      - "biofeedback"
      - "neurofeedback"
      - "guided\\s+imagery"
      - "acupuncture"
      - "massage"
      - "tuina"
      - "chiropractic"
      - "osteopath"
      - "shiatsu"
      - "music\\s+therapy"
      - "music\\s+listening"
      - "art\\s+therapy"
      - "pranayama"
      - "diaphragmatic"
      - "breathing\\s+techniques?"
      - "breath\\s+work"
      - "breathwork"
      - "\\bbreathing\\b"
      - "emotional\\s+freedom\\s+technique"
      - "\\beft\\b"
      - "\\btapping\\b"
      - "basic\\s+body\\s+awareness"
      - "\\bbbat\\b"
      - "grinberg\\s+method"

  education_self_management:
    label: "Education & self-management"
    description: >
      Educational and habit-focused tools to conceptualize pain and alter daily
      routines (includes pain education, booklets/decision aids, and lifestyle content).
    patterns:
      - "pain\\s+education"
      - "pain\\s+neuroscience\\s+education"
      - "\\bpne\\b"
      - "psychoeducation"
      - "psycho-education"
      - "patient\\s+education"
      - "self[- ]management"
      - "coping\\s+skills"
      - "pain\\s+coping"
      - "coaching"
      - "counsel"
      - "pacing"
      - "diet"
      - "nutrition"
      - "dietary"
      - "weight\\s+loss"
      - "fasting"
      - "lifestyle"
      - "sleep\\s+hygiene"
      - "behavioral\\s+insomnia"
      - "\\bcbt[- ]i\\b"
      - "smoking\\s+cessation"
      - "light\\s+exposure"
      - "light\\s+deprivation"
      - "wellness"
      - "the\\s+back\\s+book"
      - "back\\s+book"
      - "back\\s+guide"
      - "comic[- ]?book"
      - "booklet"
      - "educational\\s+video"
      - "decision\\s+aid"
      - "shared\\s+decision[- ]making"
      - "shared\\s+decision\\s+making"
      - "energy\\s+conservation"
      - "pain\\s+neurobiology"
      - "neurobiology\\s+of\\s+pain"

  physical_rehabilitation:
    label: "Physical rehabilitation"
    description: >
      Biomechanics and physical capacity (exercise, strengthening, structured PT).
    patterns:
      - "exercise"
      - "physical\\s+activity"
      - "aerobic"
      - "walking"
      - "walk with ease"
      - "stretching"
      - "workout"
      - "strengthening"
      - "resistance\\s+training"
      - "movement\\s+therapy"
      - "physiotherapy"
      - "physical\\s+therapy"
      - "rehabilitation"
      - "manual\\s+therapy"

  occupational_ergonomics_rtw:
    label: "Occupational ergonomics & return-to-work"
    description: >
      Workplace, occupational therapy, ergonomics, and return-to-work / work-hardening
      protocols (may co-occur with physical or educational content).
    patterns:
      - "ergonomic"
      - "ergonomics"
      - "occupational\\s+therapy"
      - "occupational\\s+ergonomic"
      - "return[- ]to[- ]work"
      - "return\\s+to\\s+work"
      - "\\brtw\\b"
      - "work[- ]hardening"
      - "work\\s+hardening"
      - "goldilocks\\s+work"

  multidisciplinary_interdisciplinary:
    label: "Multidisciplinary / interdisciplinary program"
    description: >
      Formal multi-provider programs (e.g. intensive pain clinics combining disciplines).
      Work-hardening lives under occupational_ergonomics_rtw.
    patterns:
      - "multidisciplinary"
      - "interdisciplinary"
      - "back\\s+school"
      - "fibrowalk"
      - "functional\\s+restoration"
      - "headache\\s+management\\s+program"

  experimental_research_paradigm:
    label: "Experimental / mechanistic research paradigm"
    description: >
      Laboratory or psychophysical paradigms (QST, experimental pain, neuroimaging
      tasks) delivered as the registered intervention arm rather than a treatment program.
    patterns:
      - "psychophysical"
      - "experimental\\s+heat\\s+pain"
      - "cover\\s+story"
      - "nocebo"
      - "PASAT"
      - "quantitative\\s+sensory"
      - "\\bqst\\b"
      - "resting\\s+state\\s+eeg"
      - "picture\\s+viewing\\s+eeg"
      - "cognitive\\s+assessment\\s+mapping"
      - "affective\\s+touch"
      - "walk\\s+test"
      - "thermal\\s+stimuli"
      - "pressure\\s+pain\\s+threshold"
      - "pain\\s+threshold\\s+test"
      - "functional\\s+magnetic\\s+resonance"
      - "\\bfmri\\b"
      - "neuroimaging\\s+paradigm"
      - "experimental\\s+pain"
      - "pain\\s+modulation\\s+efficiency"
      - "conditioned\\s+pain\\s+modulation"

  digital_health_delivery:
    label: "Digital health delivery"
    description: >
      Technology-mediated delivery (apps, telehealth, VR); may co-occur with content
      categories (e.g. app-based CBT → psychological_cognitive + digital_health_delivery).
    patterns:
      - "internet-delivered"
      - "internet[- ]mediated"
      - "web-based"
      - "mobile\\s+app"
      - "smartphone"
      - "telehealth"
      - "telemedicine"
      - "virtual\\s+reality"
      - "\\bvr\\b"
      - "RELAXaHEAD"
      - "PainGuide"
      - "Migraine\\s+Manager"
      - "selfback"
      - "relevis"
      - "online\\s+bbat"

multimodal_modalities:
  pharmacological:
    intervention_types: ["DRUG", "BIOLOGICAL", "DIETARY SUPPLEMENT"]
  device:
    intervention_types: ["DEVICE"]
  procedural:
    intervention_types: ["PROCEDURE", "RADIATION", "GENETIC"]
