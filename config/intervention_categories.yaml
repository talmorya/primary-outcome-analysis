version: "2.0.0"

# Treatment-oriented intervention categories (active arms only; comparators excluded).
# Comparator arms: matched against intervention arm NAME only (not description).

control_arm:
  patterns:
    - "placebo"
    - "\\bsham\\b"
    - "wait[- ]?list"
    - "waiting list"
    - "usual care"
    - "standard care"
    - "standard medical"
    - "no intervention"
    - "attention control"
    - "control group"
    - "control arm"

mechanism_arm:
  patterns:
    - "psychophysical"
    - "experimental\\s+heat\\s+pain"
    - "cover\\s+story"
    - "nocebo"
    - "PASAT"
    - "quantitative\\s+sensory"
    - "\\bqst\\b"
    - "resting\\s+state\\s+eeg"
    - "picture\\s+viewing\\s+eeg"
    - "cognitive\\s+assessment\\s+mapping"
    - "affective\\s+touch"
    - "walk\\s+test"
    - "thermal\\s+stimuli"
    - "pressure\\s+pain\\s+threshold"
    - "pain\\s+threshold\\s+test"
    - "functional\\s+magnetic\\s+resonance"
    - "\\bfmri\\b"
    - "neuroimaging\\s+paradigm"
    - "experimental\\s+pain"
    - "pain\\s+modulation\\s+efficiency"
    - "conditioned\\s+pain\\s+modulation"
  exclude:
    - "emotional\\s+regulation"
    - "emotional\\s+(positive|negative)"
    - "\\bpbre\\b"
    - "consecutive\\s+days"
    - "administered\\s+for\\s+one\\s+hour"

categories:
  psychological_cognitive:
    label: "Psychological & cognitive therapy"
    description: >
      Changing thoughts, cognitive distortions, and behavioral coping (not brain-retraining
      or exposure-based unlearning of pain loops).
    patterns:
      - "cognitive\\s+behav"
      - "cognitive-behavioral"
      - "\\bcbt\\b"
      - "acceptance\\s+and\\s+commitment"
      - "\\bact\\b"
      - "psychotherapy"
      - "psychodynamic"
      - "interpersonal\\s+therapy"
      - "behavioral\\s+therapy"
      - "behavioural\\s+therapy"
      - "emdr"
      - "dialectical\\s+behavior"
      - "\\bdbt\\b"
      - "motivational\\s+interview"
      - "operant\\s+behavioral"
      - "emotional\\s+regulation"
      - "\\bpbre\\b"
      - "cognitive\\s+functional"
      - "\\bcft\\b"

  neuroplastic_recovery_therapy:
    label: "Neuroplastic recovery therapy"
    description: >
      Brain-retraining approaches aimed at unlearning maladaptive neural pain loops
      (distinct from general cognitive coping).
    patterns:
      - "pain\\s+reprocess"
      - "pain\\s+re-processing"
      - "\\bprt\\b"
      - "emotional\\s+awareness\\s+and\\s+expression"
      - "\\beaet\\b"
      - "exposure\\s+therapy"
      - "graded\\s+exposure"

  mind_body_integrative:
    label: "Mind-body & integrative practice"
    description: >
      Movement, touch, or body-based practice integrated with mental focus to calm
      the nervous system (includes former mind-body and complementary categories).
    patterns:
      - "mindful"
      - "\\bmbsr\\b"
      - "\\bmbct\\b"
      - "mindfulness"
      - "meditation"
      - "hypnosis"
      - "hypnotherapy"
      - "relaxation"
      - "progressive\\s+muscle"
      - "yoga"
      - "tai\\s+chi"
      - "pilates"
      - "biofeedback"
      - "neurofeedback"
      - "guided\\s+imagery"
      - "acupuncture"
      - "massage"
      - "tuina"
      - "chiropractic"
      - "osteopath"
      - "shiatsu"
      - "music\\s+therapy"
      - "music\\s+listening"
      - "art\\s+therapy"

  education_self_management:
    label: "Education & self-management"
    description: >
      Educational and habit-focused tools to conceptualize pain and alter daily
      routines (includes pain education and lifestyle-oriented behavioral content).
    patterns:
      - "pain\\s+education"
      - "pain\\s+neuroscience\\s+education"
      - "\\bpne\\b"
      - "psychoeducation"
      - "psycho-education"
      - "patient\\s+education"
      - "self[- ]management"
      - "coping\\s+skills"
      - "pain\\s+coping"
      - "coaching"
      - "counsel"
      - "pacing"
      - "diet"
      - "nutrition"
      - "dietary"
      - "weight\\s+loss"
      - "fasting"
      - "lifestyle"
      - "sleep\\s+hygiene"
      - "behavioral\\s+insomnia"
      - "\\bcbt[- ]i\\b"
      - "smoking\\s+cessation"
      - "light\\s+exposure"
      - "light\\s+deprivation"
      - "wellness"

  physical_rehabilitation:
    label: "Physical rehabilitation"
    description: >
      Biomechanics and physical capacity (exercise, strengthening, structured PT).
    patterns:
      - "exercise"
      - "physical\\s+activity"
      - "aerobic"
      - "walking"
      - "walk with ease"
      - "stretching"
      - "workout"
      - "strengthening"
      - "resistance\\s+training"
      - "movement\\s+therapy"
      - "physiotherapy"
      - "physical\\s+therapy"
      - "rehabilitation"
      - "manual\\s+therapy"

  multidisciplinary_interdisciplinary:
    label: "Multidisciplinary / interdisciplinary program"
    description: >
      Formal multi-provider programs (e.g. intensive pain clinics combining disciplines).
    patterns:
      - "multidisciplinary"
      - "interdisciplinary"
      - "back\\s+school"
      - "fibrowalk"
      - "functional\\s+restoration"
      - "work[- ]hardening"
      - "headache\\s+management\\s+program"

  digital_health_delivery:
    label: "Digital health delivery"
    description: >
      Technology-mediated delivery (apps, telehealth, VR); may co-occur with content
      categories (e.g. app-based CBT → psychological_cognitive + digital_health_delivery).
    patterns:
      - "internet-delivered"
      - "web-based"
      - "mobile\\s+app"
      - "smartphone"
      - "telehealth"
      - "telemedicine"
      - "virtual\\s+reality"
      - "\\bvr\\b"
      - "RELAXaHEAD"
      - "PainGuide"
      - "Migraine\\s+Manager"

multimodal_modalities:
  pharmacological:
    intervention_types: ["DRUG", "BIOLOGICAL", "DIETARY SUPPLEMENT"]
  device:
    intervention_types: ["DEVICE"]
  procedural:
    intervention_types: ["PROCEDURE", "RADIATION", "GENETIC"]
