version: "0.2.0"

# Psychological/behavioral approaches among BEHAVIORAL intervention types.
approaches:
  cbt:
    patterns:
      - "cognitive\\s+behav"
      - "cognitive\\s+behaviour"
      - "cognitive-behavioral"
      - "cognitive-behavioural"
      - "\\bcbt\\b"
    exclude:
      - "acceptance\\s+and\\s+commitment"

  act:
    patterns:
      - "acceptance\\s+and\\s+commitment"
      - "acceptance-based\\s+therapy"

  mindfulness_mbsr_mbct:
    patterns:
      - "mindful"
      - "\\bmbsr\\b"
      - "\\bmbct\\b"
      - "mindfulness-based"

  meditation:
    patterns:
      - "meditation"

  hypnosis:
    patterns:
      - "hypnosis"
      - "hypnotherapy"

  biofeedback:
    patterns:
      - "biofeedback"
      - "neurofeedback"

  relaxation:
    patterns:
      - "relaxation"
      - "progressive\\s+muscle"

  psychotherapy_general:
    patterns:
      - "psychotherapy"
      - "psychodynamic"
      - "interpersonal\\s+therapy"
      - "supportive\\s+therapy"
    review_flag: true

  behavioral_therapy_general:
    patterns:
      - "behavioral\\s+therapy"
      - "behavioural\\s+therapy"
      - "behavior\\s+therapy"
      - "behaviour\\s+therapy"
    exclude:
      - "cognitive"
    review_flag: true

  acceptance_based:
    patterns:
      - "acceptance-based"
      - "pain\\s+acceptance"

  pain_education:
    patterns:
      - "pain\\s+education"
      - "pain\\s+neuroscience\\s+education"
      - "\\bpne\\b"

  psychoeducation:
    patterns:
      - "psychoeducation"
      - "psycho-education"
      - "patient\\s+education"
      - "migraine\\s+education"
      - "headache\\s+education"
      - "awareness\\s+session"
      - "educational\\s+video"
    review_flag: true

  self_management:
    patterns:
      - "self[- ]management"
      - "pain\\s+self[- ]management"

  emdr:
    patterns:
      - "emdr"
      - "eye\\s+movement\\s+desensitization"

  prt:
    patterns:
      - "pain\\s+reprocessing\\s+therapy"
      - "pain\\s+reprocessing"

  counseling:
    patterns:
      - "counsel"
      - "counsell"
    review_flag: true

  coaching:
    patterns:
      - "coaching"

  digital_psychological:
    patterns:
      - "internet-delivered"
      - "web-based"
      - "mobile\\s+app"
      - "smartphone\\s+app"
      - "telehealth"
      - "telemedicine"
      - "virtual\\s+reality"
      - "RELAXaHEAD"
      - "PainGuide"
      - "Migraine\\s+Manager"
      - "Emotiv"
    review_flag: true

  cognitive_functional_therapy:
    patterns:
      - "cognitive\\s+functional"
      - "\\bcft\\b"

  motivational_interviewing:
    patterns:
      - "motivational\\s+interview"
      - "motivational\\s+support"
      - "mi-opioid"

  exposure_therapy:
    patterns:
      - "exposure\\s+therapy"
      - "graded\\s+exposure"
      - "\\bI-EAET\\b"
      - "in\\s+vivo\\s+exposure"

  coping_skills_training:
    patterns:
      - "coping\\s+skills"
      - "pain\\s+coping\\s+skills"
      - "PainCOACH"

  operant_behavioral:
    patterns:
      - "operant\\s+behavioral"
      - "operant\\s+learning"
    exclude:
      - "paradigm"
      - "experimental"
      - "psychophysical"

  multidisciplinary_pain_program:
    patterns:
      - "multidisciplinary"
      - "interdisciplinary"
      - "back\\s+school"
      - "fibrowalk"
      - "work[- ]hardening"
      - "functional\\s+restoration"
      - "headache\\s+management\\s+program"
    review_flag: true

  sleep_intervention:
    patterns:
      - "behavioral\\s+insomnia"
      - "\\bcbt[- ]i\\b"
      - "sleep\\s+stabilization"

  dialectical_behavior:
    patterns:
      - "dialectical\\s+behavior"
      - "\\bdbt\\b"

  other_psychological:
    patterns:
      - "emotional\\s+regulation"
      - "\\bpbre\\b"
      - "emotional\\s+(positive|negative)\\s+words"
    review_flag: true

# Behavioral interventions that are typically not psychological in focus.
non_psychological_behavioral:
  physical_activity:
    patterns:
      - "exercise"
      - "physical\\s+activity"
      - "aerobic"
      - "walking"
      - "stretching"
      - "training"
      - "workout"
      - "movement\\s+therapy"
      - "yoga"
      - "pilates"
      - "tai\\s+chi"

  dietary_nutrition:
    patterns:
      - "diet"
      - "nutrition"
      - "dietary"
      - "caloric"
      - "weight\\s+loss"
      - "fasting"

  lifestyle_general:
    patterns:
      - "lifestyle"
      - "sleep\\s+hygiene"
      - "smoking\\s+cessation"
      - "health\\s+education"
      - "wellness"
      - "light\\s+exposure"
      - "light\\s+deprivation"

  behavioral_other:
    patterns:
      - "behavioral\\s+intervention"
      - "behavioural\\s+intervention"
    review_flag: true

  research_paradigm:
    patterns:
      - "psychophysical"
      - "experimental\\s+heat\\s+pain"
      - "cover\\s+story"
      - "nocebo"
      - "PASAT"
      - "quantitative\\s+sensory"
      - "\\bqst\\b"
      - "resting\\s+state\\s+eeg"
      - "picture\\s+viewing\\s+eeg"
      - "cognitive\\s+assessment\\s+mapping"
      - "affective\\s+touch"
      - "walk\\s+test"
      - "light\\s+deprivation"
      - "light\\s+exposure.*flash"
      - "word\\s+reading\\s+task"
      - "virtual\\s+dodgeball"
      - "hyperventilation.*postural\\s+control"
      - "thermal\\s+stimuli"
      - "pressure\\s+pain\\s+threshold"
      - "pain\\s+threshold\\s+test"
      - "functional\\s+magnetic\\s+resonance"
      - "\\bfmri\\b"
    exclude:
      - "emotional\\s+regulation"
      - "emotional\\s+(positive|negative)"
      - "\\bpbre\\b"
      - "consecutive\\s+days"
      - "administered\\s+for\\s+one\\s+hour"
    review_flag: true

# Non-behavioral co-intervention modalities (when present in the same trial).
other_modality_types:
  pharmacological:
    intervention_types: ["DRUG", "BIOLOGICAL", "DIETARY SUPPLEMENT"]

  device:
    intervention_types: ["DEVICE"]

  surgical_procedure:
    intervention_types: ["PROCEDURE", "RADIATION", "GENETIC"]

  complementary_integrative:
    patterns:
      - "acupuncture"
      - "massage"
      - "chiropractic"
      - "osteopath"

  physical_rehabilitation:
    patterns:
      - "physiotherapy"
      - "physical\\s+therapy"
      - "rehabilitation"
      - "manual\\s+therapy"
